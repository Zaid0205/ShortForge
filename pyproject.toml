[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shortforge"
version = "0.1.0"
description = "Turn a topic into a captioned vertical YouTube Short with LLM scripting, local TTS and FLUX images."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Hamza Ahmed" }]
dynamic = ["dependencies"]

[project.scripts]
shortforge = "shortforge.cli:app"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
